shell             zsh
shell_integration enabled

allow_remote_control yes

font_family       0xProto Nerd Font Mono
bold_font         0xProto Nerd Font Mono
italic_font       0xProto Nerd Font Mono
bold_italic_font  0xProto Nerd Font Mono
font_size         12.0
disable_ligatures never
modify_font       cell_height 110%
symbol_map        U+E000-U+F8FF Symbols Nerd Font

cursor_shape      beam
cursor_blink_interval 0.5

scrollback_lines  10000

url_color #58a6ff
url_style curly
detect_urls yes

window_padding_width  10
window_margin_width   0
hide_window_decorations yes
background_opacity    1
dynamic_background_opacity yes
confirm_os_window_close 0

tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

repaint_delay     8
input_delay       3
sync_to_monitor   yes

foreground              #e6edf3
background              #0d1117
selection_foreground    #e6edf3
selection_background    #17335a

cursor                  #2f81f7
cursor_text_color       #0d1117

url_color               #58a6ff

active_border_color     #58a6ff
inactive_border_color   #30363d
bell_border_color       #d29922

active_tab_foreground   #e6edf3
active_tab_background   #30363d
inactive_tab_foreground #7d8590
inactive_tab_background #161b22
tab_bar_background      #0d1117

color0  #484f58
color8  #6e7681
color1  #ff7b72
color9  #ffa198
color2  #3fb950
color10 #56d364
color3  #d29922
color11 #e3b341
color4  #58a6ff
color12 #79c0ff
color5  #bc8cff
color13 #d2a8ff
color6  #39c5cf
color14 #56d4dd
color7  #b1bac4
color15 #ffffff

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+plus  change_font_size all +1
map ctrl+shift+minus change_font_size all -1
map ctrl+shift+0     change_font_size all 0

globinclude macos.conf
